<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1220">
<title>여로 사진 올리기</title>
<style>
  :root { --bg: #0E1220; --card: #171C2E; --line: #2A3150; --text: #F2F0EA; --dim: #A7ABBE; --amber: #FFB46A; --bad: #FF8A80; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px calc(32px + env(safe-area-inset-bottom)); }
  .brand { color: var(--amber); font-weight: 700; letter-spacing: 0.08em; font-size: 14px; }
  h1 { font-size: 27px; line-height: 1.3; margin: 8px 0 6px; word-break: keep-all; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 68px;
    margin: 0 0 12px; border-radius: 16px; font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
    border: 2px solid var(--amber); background: transparent; color: var(--amber);
  }
  .btn.primary { background: var(--amber); color: #1B1408; }
  .btn:disabled { opacity: 0.35; cursor: default; }
  .btn:focus-within, .btn:focus-visible { outline: 3px solid #fff3; outline-offset: 2px; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .note { color: var(--dim); font-size: 15px; margin: 4px 0; word-break: keep-all; }
  .progress { margin: 20px 0 8px; }
  .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--amber); transition: width 0.2s; }
  .progress p { margin: 8px 0 0; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0; padding: 0; list-style: none; }
  .grid li { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--card); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid li.done::after { content: "✓"; position: absolute; right: 4px; bottom: 2px; color: var(--amber); font-weight: 800; text-shadow: 0 0 4px #000; }
  .grid li.bad { display: flex; align-items: center; justify-content: center; padding: 4px; text-align: center; font-size: 12px; color: var(--bad); }
  .grid li.bad img { position: absolute; inset: 0; opacity: 0.25; }
  .grid li.bad span { position: relative; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; font-size: 19px; font-weight: 600; word-break: keep-all; }
  .msg.bad { border-color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">여로</div>
  <h1 id="title">여행 사진 올리기</h1>
  <p class="sub" id="sub">여행 정보를 불러오는 중이에요…</p>

  <div id="error" class="msg bad" hidden></div>

  <section id="form" hidden>
    <label class="btn" id="pick">사진 고르기<input id="file" type="file" accept="image/*" multiple></label>
    <button class="btn primary" id="send" type="button" disabled>여로 앨범에 올리기</button>
    <p class="note">사진 고르기는 나중에 해도 돼요. 이 주소는 30일 동안 열려 있어요.</p>
    <p class="note">얼굴 인식 없이 찍은 시각으로만 정리해요.</p>
    <div class="progress" id="progress" hidden>
      <div class="bar"><i id="barFill"></i></div>
      <p id="progressText"></p>
    </div>
    <ul class="grid" id="grid"></ul>
    <div id="done" class="msg" hidden></div>
  </section>
</main>
<script type="module" src="./page.js"></script>
</body>
</html>
